<link rel="stylesheet" href="/assets/css/style.css?v=19">
<style>
  /* 404: Pinokkio swears the page exists, while his nose grows across the screen */
  body{overflow-x:hidden}
  .lost{min-height:100svh;display:grid;place-items:center;padding-block:40px;text-align:center}
  .lost .wrap{display:grid;justify-items:center;gap:18px}
  .big404{font-size:clamp(56px,14vw,140px);--g:clamp(6px,1.4vw,14px);justify-content:center}
  .face404{position:relative;width:min(240px,55vw);aspect-ratio:1;margin-block:6px 0}
  .face404 svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;--nose:1;--leaf:0}
  .lost h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.6vw,46px);line-height:1.1;margin:0;max-width:20ch;text-wrap:balance}
  .lost h1 em{font-style:normal;background:var(--paper);color:var(--ink);padding:0 .14em;display:inline-block;transform:rotate(-2deg)}
  .lost p{margin:0;color:var(--muted);max-width:46ch}
  .lost .sm{font-family:var(--f-type);font-size:14px}
  .nose-cm{font-family:var(--f-type);font-size:13px;color:var(--yolk)}
  .lang404{position:fixed;top:16px;right:16px;margin:0}
</style>

<div class="lang lang404" role="group" aria-label="Kies taal"><button type="button" data-lang="nl" aria-pressed="true">NL</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
<main class="lost">
  <div class="wrap">
    <div class="ransom big404" data-word="404" data-seed="9" aria-label="404"></div>
    <div class="face404" aria-hidden="true"><svg viewBox="88 36 150 156" id="face"><use href="#pHead" width="320" height="560"/></svg></div>
    <h1 data-i18n>Deze pagina bestaat. <em>Echt waar.</em></h1>
    <p data-i18n class="sm" id="lie404">Zie je zijn neus? Dan weet je genoeg.</p>
    <span class="nose-cm" id="cm">neus: 4 cm</span>
    <p data-i18n>De pagina die je zoekt is er niet, of ze is verhuisd. Pinokkio wil het niet toegeven.</p>
    <div class="btns" style="justify-content:center">
      <a class="btn" href="/" data-i18n>Terug naar home</a>
      <a class="btn ghost" href="/#contact" data-i18n>Iets melden</a>
    </div>
  </div>
</main>
<script>
(function(){
  const EN={
    "Deze pagina bestaat. Echt waar.":"This page exists. Honestly.",
    "Zie je zijn neus? Dan weet je genoeg.":"See his nose? Then you know enough.",
    "De pagina die je zoekt is er niet, of ze is verhuisd. Pinokkio wil het niet toegeven.":"The page you're looking for isn't here, or it has moved. Pinocchio just won't admit it.",
    "Terug naar home":"Back to home","Iets melden":"Report something",
    "Echt waar.":"Honestly.","Deze pagina bestaat.":"This page exists.","Kies taal":"Choose language"
  };
  let lang="nl";
  try{const s=localStorage.getItem("onex-lang");if(s)lang=s;else if(!/^nl/i.test(navigator.language||"nl"))lang="en";}catch(e){}
  const T=s=>lang==="en"&&EN[s]?EN[s]:s;

  /* ransom "404" */
  const styles=[["#cfcfcf","#141414","'Abril Fatface',Georgia,serif"],["#2f6fd0","#dce7f6","'Bowlby One','Arial Black',sans-serif"],["#e8b021","#d6312a","'Special Elite','Courier New',monospace"]];
  const big=document.querySelector(".big404");
  [..."404"].forEach((ch,i)=>{const l=document.createElement("span");l.className="l";l.textContent=ch;const st=styles[i];
    l.style.background=st[0];l.style.color=st[1];l.style.fontFamily=st[2];l.style.transform=`rotate(${[-6,4,-3][i]}deg) translateY(${[0,-.06,.05][i]}em)`;big.appendChild(l)});

  /* texts */
  const nodes=[...document.querySelectorAll("[data-i18n]")].map(el=>[el,el.innerHTML]);
  function apply(){
    document.documentElement.lang=lang;
    nodes.forEach(([el,html])=>{
      if(el.tagName==="H1")el.innerHTML=T("Deze pagina bestaat.")+" <em>"+T("Echt waar.")+"</em>";
      else el.textContent=T(el.textContent.trim()===html.trim()||lang==="nl"?html.trim():el.textContent.trim());
    });
    if(lang==="nl")nodes.forEach(([el,html])=>{el.innerHTML=html});
    document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
    unit();
  }
  document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("onex-lang",lang)}catch(e){};apply()}));

  /* the nose keeps growing, all the way across the screen */
  const face=document.getElementById("face"),cm=document.getElementById("cm");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let n=1;
  function unit(){cm.textContent=(lang==="en"?"nose: ":"neus: ")+Math.round(4*n)+" cm"}
  function grow(){
    const r=face.getBoundingClientRect();
    const maxN=Math.max(2,(innerWidth-r.left-r.width*0.55)/(r.width*0.27)+1); /* until it reaches the edge */
    if(n<maxN){n=Math.min(maxN,n+0.35);face.style.setProperty("--nose",n.toFixed(2));face.style.setProperty("--leaf",n>3?1:0);unit()}
  }
  if(reduce){n=6;face.style.setProperty("--nose",n);face.style.setProperty("--leaf",1)}
  else setInterval(grow,450);
  apply();
})();
</script>
</body>
</html>
