<style>
  /* 404: Geppetto's workshop at night. A "wanted" poster for the lost page, Pinokkio searching behind the workbench,
     the cricket with a lantern, sawdust drifting in the candle light. */
  :root{--plank:#1c1527;--plank2:#16111f;--glow:#e8b02126}
  html,body{background:var(--ink)}
  body{overflow-x:hidden;min-height:100svh;
    background:
      radial-gradient(ellipse 60% 50% at 50% 38%,var(--glow),transparent 70%),
      repeating-linear-gradient(90deg,var(--plank) 0 118px,var(--plank2) 118px 120px),
      var(--ink);background-attachment:fixed}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000a 100%)}
  .scene{position:relative;min-height:100svh;display:grid;justify-items:center;align-content:center;gap:clamp(14px,2.4vw,22px);padding:84px 20px 48px;text-align:center}
  .lang404{position:fixed;top:16px;right:16px;margin:0;z-index:5}
  .home404{position:fixed;top:14px;left:16px;z-index:5;display:block}
  .home404 img{height:46px;width:auto;display:block}

  /* hanging 404 */
  .big404{font-size:clamp(46px,10vw,104px);--g:clamp(10px,2vw,22px);justify-content:center;padding-top:clamp(46px,8vw,76px);position:relative;margin:0}
  .big404::before{content:"";position:absolute;top:clamp(8px,1.6vw,16px);left:50%;width:calc(100% + 50px);height:12px;transform:translateX(-50%);border-radius:6px;
    background:linear-gradient(180deg,#e3a466,#c88a4b 50%,#7e4a22);box-shadow:0 6px 12px #0008}
  .big404 .hg{position:relative;display:inline-block;transform-origin:50% calc(-1 * clamp(38px,6.6vw,60px));animation:hang var(--t) ease-in-out infinite;animation-delay:var(--d);cursor:pointer}
  .big404 .hg::before{content:"";position:absolute;left:50%;bottom:100%;width:1.5px;height:clamp(38px,6.6vw,60px);background:#e6dfcfaa}
  .big404 .hg::after{content:"";position:absolute;left:calc(50% - 4px);top:-4px;width:8px;height:8px;border-radius:50%;background:var(--yolk);box-shadow:0 0 0 2px var(--ink);z-index:2}
  @keyframes hang{0%,100%{transform:rotate(calc(var(--a) * -1))}50%{transform:rotate(var(--a))}}
  .big404 .hg.drop{animation:fall 1.2s cubic-bezier(.5,0,.7,.4) forwards}
  @keyframes fall{0%{transform:rotate(0)}30%{transform:rotate(25deg)}100%{transform:translateY(70vh) rotate(160deg);opacity:0}}

  /* wanted poster */
  .poster{position:relative;width:min(420px,100%);background:#efe4c9;color:var(--ink);padding:22px 24px 20px;transform:rotate(-1.6deg);
    box-shadow:0 18px 40px #000c;background-image:radial-gradient(circle at 20% 10%,#0000000d 0 30%,transparent 60%),radial-gradient(circle at 90% 90%,#5a331722 0 20%,transparent 50%);
    clip-path:polygon(0 2%,6% 0,20% 1.5%,38% 0,55% 1.2%,74% 0,92% 1.6%,100% 0,99% 30%,100% 62%,98.6% 100%,80% 98.4%,60% 100%,40% 98.6%,18% 100%,0 98.6%,1.2% 70%,0 36%)}
  .poster .pin{position:absolute;top:8px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7a6e,#b3241c);box-shadow:0 2px 3px #0008}
  .poster .pin.l{left:12px}.poster .pin.r{right:12px}
  .wanted{font-size:clamp(28px,5.4vw,44px);--g:3px;justify-content:center;margin-bottom:8px}
  .poster h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,32px);line-height:1.1;margin:0 0 10px}
  .poster dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 auto 12px;max-width:300px;text-align:left;font-family:var(--f-type);font-size:14px}
  .poster dt{color:#6b5a45}
  .poster dd{margin:0}
  .reward{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-block);font-size:13px;letter-spacing:.06em;background:var(--red);color:var(--paper);padding:6px 10px;transform:rotate(1.5deg)}
  .reward svg{width:18px;height:18px}

  /* workbench scene */
  .bench{position:relative;width:min(560px,100%);height:150px;margin-top:6px}
  .bench .top{position:absolute;left:0;right:0;bottom:56px;height:16px;border-radius:4px;background:linear-gradient(180deg,#d89a5a,#8a5429);box-shadow:0 8px 14px #000a;z-index:3}
  .bench .top::after{content:"";position:absolute;inset:3px 8px auto;height:2px;background:repeating-linear-gradient(90deg,#ffffff26 0 30px,transparent 30px 52px)}
  .bench .leg{position:absolute;bottom:0;width:16px;height:58px;background:linear-gradient(90deg,#6b3c1b,#a5672f,#6b3c1b);z-index:2}
  .bench .leg.l{left:34px}.bench .leg.r{right:34px}
  .pino{position:absolute;left:50%;bottom:64px;width:120px;height:120px;transform:translateX(-50%);z-index:1;animation:peek 6s ease-in-out infinite}
  .pino svg{width:100%;height:100%;overflow:visible;animation:look 3.2s ease-in-out infinite;transform-origin:50% 90%}
  @keyframes peek{0%,100%{transform:translate(-50%,18px)}20%,80%{transform:translate(-50%,-4px)}}
  @keyframes look{0%,100%{transform:rotate(0)}25%,45%{transform:rotate(-12deg) translateX(-6px)}65%,85%{transform:rotate(10deg) translateX(6px)}}
  .qm{position:absolute;font-family:var(--f-display);color:var(--yolk);font-size:30px;opacity:0;animation:qpop 3.2s ease-in-out infinite;z-index:4}
  .qm1{left:calc(50% - 86px);bottom:150px;animation-delay:.6s}.qm2{left:calc(50% + 60px);bottom:160px;animation-delay:2.2s;color:var(--paper)}
  @keyframes qpop{0%,10%{opacity:0;transform:translateY(8px) scale(.6)}20%,40%{opacity:1;transform:none}55%,100%{opacity:0;transform:translateY(-10px)}}
  /* tools on the bench */
  .tools{position:absolute;left:0;right:0;bottom:72px;height:60px;z-index:4;pointer-events:none}
  .tools svg{position:absolute;bottom:0;overflow:visible;filter:drop-shadow(0 3px 3px #0008)}
  .t-saw{left:6%;width:96px}.t-hammer{right:24%;width:58px}.t-block{right:6%;width:54px}.t-lamp{left:28%;width:46px;bottom:0}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
  @keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12,.92) rotate(3deg)}}
  .halo{animation:halo 2.4s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.55}50%{opacity:.85}}
  /* sawdust */
  .dust{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .dust i{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:#e8c79a;opacity:.0;animation:rise var(--dur) linear infinite;animation-delay:var(--dl)}
  @keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.5}90%{opacity:.4}100%{transform:translate(var(--dx),-105vh);opacity:0}}

  .lost-text{display:grid;gap:12px;justify-items:center;max-width:52ch;position:relative;z-index:2}
  .lost-text p{margin:0;color:#d3cde0}
  .maybe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .maybe a{font-family:var(--f-type);font-size:14px;padding:7px 11px;background:var(--ink-3);border:1px solid var(--line);color:var(--text);transition:transform .2s,border-color .2s}
  .maybe a:nth-child(odd){transform:rotate(-1.5deg)}.maybe a:nth-child(even){transform:rotate(1.5deg)}
  .maybe a:hover{transform:rotate(0) translateY(-3px);border-color:var(--yolk)}
  .sm{font-family:var(--f-type);font-size:13px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  @media (max-width:480px){.t-saw{width:70px}.t-hammer{right:20%}.bench{height:150px;margin-top:34px}.pino{width:100px;height:100px}}
</style>
</head>

    <div class="tools">
      <svg class="t-saw" viewBox="0 0 96 40"><path d="M6 30L70 22l-2 12-60 4z" fill="#c9ccd2" stroke="#5c6068" stroke-width="1.2"/><path d="M8 38l4-4 4 3 4-4 4 3 4-4 4 3 4-4 4 3 4-4 4 3 4-4 4 3 4-4 4 3" stroke="#5c6068" stroke-width="1" fill="none"/><path d="M68 18c8-6 22-4 24 6s-10 14-20 12z" fill="#b5763d" stroke="#5a3317" stroke-width="1.4"/><ellipse cx="80" cy="25" rx="5" ry="3.4" fill="#1c1527"/></svg>
      <div class="t-lamp" style="position:absolute;bottom:0"><svg viewBox="0 0 46 60" style="position:static;width:100%"><circle class="halo" cx="23" cy="20" r="22" fill="#e8b021" opacity=".25"/><rect x="11" y="44" width="24" height="12" rx="2" fill="#7e4a22" stroke="#3d200c" stroke-width="1.2"/><rect x="15" y="26" width="16" height="20" rx="3" fill="#ece6d8" stroke="#3d200c" stroke-width="1.2"/><path class="flame" d="M23 8c4 6 6 10 3 14-2 2-5 2-6 0-3-4 0-8 3-14z" fill="#ffcf5a" stroke="#e08a1e" stroke-width="1"/><path d="M23 22v4" stroke="#3d200c" stroke-width="1.2"/></svg></div>
      <svg class="t-hammer" viewBox="0 0 58 40"><rect x="6" y="28" width="46" height="6" rx="3" fill="#b5763d" stroke="#5a3317" stroke-width="1.2" transform="rotate(-8 29 31)"/><path d="M36 14h14c3 0 5 3 5 6v4H36z" fill="#8f939a" stroke="#4a4e55" stroke-width="1.2" transform="rotate(-8 45 20)"/><path d="M36 14l-6 6 6 4z" fill="#8f939a" stroke="#4a4e55" stroke-width="1.2" transform="rotate(-8 45 20)"/></svg>
      <svg class="t-block" viewBox="0 0 54 40"><rect x="4" y="10" width="40" height="28" rx="2" fill="#d89a5a" stroke="#5a3317" stroke-width="1.4"/><path d="M4 10l8-8h40l-8 8zM44 10l8-8v28l-8 8z" fill="#b5763d" stroke="#5a3317" stroke-width="1.4"/><path d="M10 20q12 4 26 0M10 28q12 3 26 0" stroke="#a5672f" stroke-width="1" fill="none"/></svg>
    </div>
    <div class="top"></div><i class="leg l"></i><i class="leg r"></i>

  <div class="lost-text">
    <p data-t>Pinokkio zweert dat deze pagina bestaat. Zijn neus zegt iets anders.</p>
    <p class="sm" data-t>Misschien zocht je:</p>
    <div class="maybe">
      <a href="/#home" data-t>Home</a><a href="/#wie" data-t>Wie ben ik</a><a href="/#skills" data-t>Skills</a><a href="/#bouwen" data-t>Laten maken</a><a href="/#contact" data-t>Contact</a>
    </div>
    <div class="btns" style="justify-content:center;margin-top:6px">
      <a class="btn" href="/" data-t>Terug naar home</a>
    </div>
    <p class="sm" data-t>Tip: klik op de cijfers van 404.</p>
  </div>
</main>

<script>
(function(){
  const EN={
    "Deze pagina":"This page","Laatst gezien:":"Last seen:","nergens":"nowhere","Adres:":"Address:","Kenmerken:":"Description:",
    "bestaat niet, of is verhuisd":"doesn't exist, or has moved","Beloning: een appel":"Reward: one apple",
    "Pinokkio zweert dat deze pagina bestaat. Zijn neus zegt iets anders.":"Pinocchio swears this page exists. His nose says otherwise.",
    "Misschien zocht je:":"Maybe you were looking for:","Home":"Home","Wie ben ik":"About me","Skills":"Skills","Laten maken":"Services","Contact":"Contact",
    "Terug naar home":"Back to home","Tip: klik op de cijfers van 404.":"Tip: click the numbers of 404.","Kies taal":"Choose language",
    "GEZOCHT":"WANTED","Gezocht":"Wanted"
  };
  let lang="nl";
  try{const s=localStorage.getItem("onex-lang");if(s)lang=s;else if(!/^nl/i.test(navigator.language||"nl"))lang="en";}catch(e){}
  const T=s=>lang==="en"&&EN[s]?EN[s]:s;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  const styles=[["#cfcfcf","#141414","'Abril Fatface',Georgia,serif"],["#2f6fd0","#dce7f6","'Bowlby One','Arial Black',sans-serif"],["#e8b021","#d6312a","'Special Elite','Courier New',monospace"],
    ["#ece6d8","#0f0c19","'Rubik Mono One','Arial Black',sans-serif"],["#d6312a","#ece6d8","'Playfair Display',Georgia,serif"],["#4a2a22","#ece6d8","'Abril Fatface',Georgia,serif"]];
  function letter(ch,i){const l=document.createElement("span");l.className="l";l.textContent=ch;const st=styles[i%styles.length];
    l.style.background=st[0];l.style.color=st[1];l.style.fontFamily=st[2];return l}

  /* hanging 404 */
  const big=document.querySelector(".big404");
  [..."404"].forEach((ch,i)=>{const hg=document.createElement("span");hg.className="hg";
    hg.style.setProperty("--a",[3,4,2.5][i]+"deg");hg.style.setProperty("--t",[2.6,2.1,2.9][i]+"s");hg.style.setProperty("--d",(-i*.7)+"s");
    hg.appendChild(letter(ch,[0,1,2][i]));hg.addEventListener("click",()=>{hg.classList.add("drop");setTimeout(()=>hg.classList.remove("drop"),1600)});big.appendChild(hg)});

  /* ransom "GEZOCHT" */
  const wanted=document.getElementById("wanted");
  function renderWanted(){wanted.textContent="";const w=document.createElement("span");w.className="w";
    [...T("GEZOCHT")].forEach((ch,i)=>{const l=letter(ch,(i*5+2)%styles.length);l.style.transform=`rotate(${[-5,3,-2,4,-4,2,-3][i%7]}deg)`;w.appendChild(l)});wanted.appendChild(w)}

  /* which address was asked for */
  document.getElementById("path").textContent=decodeURIComponent(location.pathname).slice(0,40)||"/";

  /* texts */
  const nodes=[...document.querySelectorAll("[data-t]")].map(el=>[el,el.textContent.trim()]);
  function apply(){
    document.documentElement.lang=lang;
    nodes.forEach(([el,nl])=>el.textContent=T(nl));
    renderWanted();
    document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  }
  document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("onex-lang",lang)}catch(e){};apply()}));
  apply();

  /* sawdust in the candle light */
  if(!reduce){const d=document.getElementById("dust");
    for(let i=0;i<26;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.setProperty("--s",(2+Math.random()*3)+"px");
      p.style.setProperty("--dur",(9+Math.random()*10)+"s");p.style.setProperty("--dl",(-Math.random()*18)+"s");p.style.setProperty("--dx",(Math.random()*80-40)+"px");d.appendChild(p)}}
})();
</script>
</body>
</html>
